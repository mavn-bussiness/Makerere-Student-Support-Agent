name: BSE4104 Agentic CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Code Quality, Schema & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest pytest-asyncio

      - name: Lint Code with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv
          # Exit-zero treats all warnings as non-fatal
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics --exclude=.venv,venv

      - name: Validate Source Register JSON Schema
        run: |
          python -c "
          import json, sys
          try:
              with open('knowledge/source_register.json', 'r') as f:
                  data = json.load(f)
              assert 'documents' in data and len(data['documents']) > 0, 'No documents found in register'
              for doc in data['documents']:
                  assert all(k in doc for k in ['id', 'title', 'category', 'authority']), f'Invalid doc schema: {doc}'
              print('✅ source_register.json schema validation passed.')
          except Exception as e:
              print(f'❌ Validation failed: {e}')
              sys.exit(1)
          "

      - name: Check Environment Template Integrity
        run: |
          test -f .env.example || { echo "❌ .env.example is missing!"; exit 1; }
          echo "✅ .env.example verified."

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v